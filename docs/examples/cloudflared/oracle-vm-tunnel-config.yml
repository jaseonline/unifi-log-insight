# cloudflared config for the DEDICATED tunnel that serves this VM only.
# See docs/wiki/Oracle-Cloud-Deployment.md for why this is a separate tunnel
# rather than another connector on a tunnel that also serves LAN-only hosts.
#
# Typical location: /etc/cloudflared/config.yml on the VM, referenced by the
# cloudflared systemd service (`cloudflared tunnel --config /etc/cloudflared/config.yml run`).

tunnel: <your-tunnel-id>
credentials-file: /etc/cloudflared/<your-tunnel-id>.json

ingress:
  - hostname: insights.<yourdomain>
    service: http://127.0.0.1:8090
  - service: http_status:404   # catch-all — required as the last rule
